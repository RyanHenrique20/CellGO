name: Atualizar arte do perfil

on:
  schedule:
    # todos os dias, 06:17 UTC (03:17 em São Paulo)
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: arte-do-perfil
  cancel-in-progress: true

jobs:
  redesenhar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar dados e redesenhar cenas
        run: node scripts/sincronizar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commitar arte atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arte data
          if git diff --staged --quiet; then
            echo "Nada mudou desde a última execução."
          else
            git commit -m "chore(arte): redesenhando o campo de asteroides [skip ci]"
            git push
          fi
